# =====================================================================================
# configtxgen 通道配置：校园公益众筹存证溯源系统
#   * 通道名称 charitychannel
#   * 联盟 CampusCharityConsortium：Org1（校方公益管理）+ Org2（监管审计）
#   * 背书策略：AND('Org1MSP.peer','Org2MSP.peer') —— 链上存证需多方共同背书
#   * 排序：etcdraft 单节点（普通 PC 测试网；生产可扩为 3 节点）
# 生成命令：
#   configtxgen -profile CharityGenesis -channelID system-channel -outputBlock ./channel-artifacts/genesis.block
#   configtxgen -profile CharityChannel -outputCreateChannelTx ./channel-artifacts/charitychannel.tx -channelID charitychannel
#   configtxgen -profile CharityChannel -outputAnchorPeersUpdate ./channel-artifacts/Org1MSPanchors.tx -channelID charitychannel -asOrg Org1MSP
#   configtxgen -profile CharityChannel -outputAnchorPeersUpdate ./channel-artifacts/Org2MSPanchors.tx -channelID charitychannel -asOrg Org2MSP
# =====================================================================================
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ./organizations/ordererOrganizations/campus.edu/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.campus.edu:7050

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: ./organizations/peerOrganizations/org1.campus.edu/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    AnchorPeers:
      - Host: peer0.org1.campus.edu
        Port: 7051

  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: ./organizations/peerOrganizations/org2.campus.edu/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org2MSP.peer')"
    AnchorPeers:
      - Host: peer0.org2.campus.edu
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.campus.edu:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.campus.edu
        Port: 7050
        ClientTLSCert: ./organizations/ordererOrganizations/campus.edu/orderers/orderer.campus.edu/tls/server.crt
        ServerTLSCert: ./organizations/ordererOrganizations/campus.edu/orderers/orderer.campus.edu/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  # 系统通道创世块
  CharityGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      CampusCharityConsortium:
        Organizations:
          - *Org1
          - *Org2

  # 业务通道 charitychannel
  CharityChannel:
    Consortium: CampusCharityConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1
        - *Org2
